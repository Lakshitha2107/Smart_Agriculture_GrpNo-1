<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farm Details</title>
<link rel="stylesheet" href="form.css">
</head>

<body>

<h1 class="title">Farm Details</h1>

<form class="registration-form">

<fieldset>

<legend>Farm Details</legend>

<label class="form-label">Name:</label>
<input class="form-input" type="text"><br><br>

<label class="form-label">Mobile Number:</label>
<input class="form-input" type="number"><br><br>

<label class="form-label">Email:</label>
<input class="form-input" type="email"><br><br>

<label class="form-label">Plot ID:</label>
<input class="form-input" type="text"><br><br>

<label class="form-label">Village:</label>
<input class="form-input" type="text"><br><br>

<label class="form-label">Crop Stage:</label>
<select class="dropdown">
<option>Germination</option>
<option>Tillering</option>
<option>Grand Growth</option>
<option>Maturity</option>
</select><br><br>

<label class="form-label">Soil Type:</label>
<select class="dropdown">
<option>Clay</option>
<option>Loamy</option>
<option>Sandy</option>
</select><br><br>

<label class="form-label">Irrigation Method:</label>
<select class="dropdown">
<option>Drip</option>
<option>Sprinkler</option>
</select><br><br>

<label class="form-label">Date:</label>
<input class="dropdown" type="date"><br><br>

<label class="form-label">Farm Photo:</label>
<input class="dropdown" type="file"><br><br>

<input class="submit" type="submit">

</fieldset>

</form>

</body>
</html>
